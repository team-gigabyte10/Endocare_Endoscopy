<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" width="420" height="130">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,800&amp;family=Montserrat:wght@400;500&amp;display=swap');
      .endo-text {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-style: italic;
        font-weight: 800;
        font-size: 76px;
        fill: #F58220;
      }
      .care-text {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-style: italic;
        font-weight: 800;
        font-size: 76px;
        fill: #0B4F9C;
      }
      .subtitle-text {
        font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
        font-size: 15.5px;
        font-weight: 500;
        letter-spacing: 6.2px;
        fill: #4B5563;
        text-transform: uppercase;
      }
    </style>
    <linearGradient id="swoosh-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B4F9C" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#0B4F9C" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#073B75" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0B4F9C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B4F9C" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Main Wordmark: Endo Care -->
  <g transform="translate(18, 68)">
    <text x="0" y="0" class="endo-text">Endo</text>
    <text x="176" y="0" class="care-text">Care</text>
  </g>

  <!-- Blue Horizon / Arch Swoop Underline -->
  <path d="M 28 82 Q 185 78 205 70 Q 225 78 385 82 Q 220 86 205 84 Q 190 86 28 82 Z" fill="url(#swoosh-grad)"/>

  <!-- Subtitle Tagline: ALL SOLUTION OF ENDOSCOPY -->
  <text x="32" y="108" class="subtitle-text">All Solution of Endoscopy</text>
</svg>
